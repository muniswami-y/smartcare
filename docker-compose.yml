services:
  postgres:
    image: postgres:16-alpine
    container_name: caresmart-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caresmart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caresmart_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-caresmart}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./database/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caresmart_user} -d ${POSTGRES_DB:-caresmart}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caresmart-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: caresmart-backend-dev
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-caresmart_user}:${POSTGRES_PASSWORD:-caresmart_secret_password}@postgres:5432/${POSTGRES_DB:-caresmart}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev_jwt_access_secret_key_at_least_32_characters_long_1234
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_key_at_least_32_characters_long_5678
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PHONE_HASH_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /app/uploads
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: caresmart-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata_dev:
  backend_uploads:
