name: CareSmart CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Test & Build Full Stack
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: caresmart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install All Workspace Dependencies
        run: npm ci

      - name: Verify i18n Key Completeness (EN, TE, HI)
        run: npm run i18n:verify --workspace=@caresmart/frontend

      - name: Setup Database & Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/caresmart_test?schema=public
        run: |
          cd database
          npx prisma generate
          npx prisma db push --skip-generate
          npm run build

      - name: Run Database Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/caresmart_test?schema=public
        run: npm test --workspace=@caresmart/database

      - name: Build Backend & Generate OpenAPI Spec
        run: |
          npm run build --workspace=@caresmart/backend
          npm run generate:openapi --workspace=@caresmart/backend

      - name: Run Backend Integration & RBAC Test Suites
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/caresmart_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_jwt_access_secret_key_minimum_32_characters_long_1234
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_minimum_32_characters_long_5678
          FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PHONE_HASH_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
        run: npm test --workspace=@caresmart/backend

      - name: Run Frontend Component Tests
        run: npm test --workspace=@caresmart/frontend

      - name: Build Frontend Production Artifacts
        run: npm run build --workspace=@caresmart/frontend
