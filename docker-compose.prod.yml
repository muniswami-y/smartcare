services:
  postgres:
    image: postgres:16-alpine
    container_name: caresmart-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./database/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caresmart_net

  redis:
    image: redis:7-alpine
    container_name: caresmart-redis-prod
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caresmart_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: caresmart-backend-prod
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      PHONE_HASH_KEY: ${PHONE_HASH_KEY}
      CORS_ORIGIN: https://${DOMAIN_NAME:-caresmart.local}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-caresmart.local}
      COOKIE_SECURE: "true"
      UPLOAD_DIR: /app/uploads
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - prod_uploads:/app/uploads
    networks:
      - caresmart_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: caresmart-frontend-prod
    restart: always
    networks:
      - caresmart_net

  caddy:
    image: caddy:2-alpine
    container_name: caresmart-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - caresmart_net

volumes:
  pgdata_prod:
  redisdata_prod:
  prod_uploads:
  caddy_data:
  caddy_config:

networks:
  caresmart_net:
    driver: bridge
